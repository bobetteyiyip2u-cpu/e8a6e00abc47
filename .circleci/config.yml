      - run:
          name: Load strands
          command: |
            printf 'strands = 50000\n' > flax.cfg
      - run:
          name: Build hair sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flaxen -j2
      - run:
