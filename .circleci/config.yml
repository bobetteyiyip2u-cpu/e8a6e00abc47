version: 2.1

jobs:
  inline-cache:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed sites
          command: |
            printf 'sites 64\n' > ic.cfg
      - run:
          name: Build dispatch core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target inline-cache -j2
      - run:
          name: Warm inline caches
          command: LIONSS_LP=1 ./build/inline-cache --conf ic.cfg --polymorphic 4
  AsciidocPdf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write adoc
          command: |
            printf '= Title\n' > doc.adoc
      - run:
          name: Build pdf converter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target AsciidocPdf -j2
      - run:
          name: Convert AsciiDoc to PDF
          command: LIONSS_LP=1 ./build/AsciidocPdf --in doc.adoc --theme book
